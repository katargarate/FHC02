<script>

    do {
        let name = prompt("What's your name?");

        let birthYear = prompt("What's your birth year?");

        let confirmed = confirm(`Is your name ${name} and your birth year ${birthYear}?`);

        if (confirmed) break;

    } while (true)
    
    
    let age = calculateAge(birthYear);

    let ofAge = age >= 18;

    if (ofAge) {
        alert(`${name}, you are ${age} years old and therefore of age`);
    } else {
        alert(`${name}, you are ${age} years old and therefore underage`);
    }

    function calculateAge(birthYear) {
        return 2026 - birthYear;
    }

</script>
