<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="toDo.js"></script>
    <link href="styles.css" rel="stylesheet">
    <title>To Do List</title>
</head>
<body>
    <header>
        <h1>To Do List</h1>

    </header>
    <main>
        <!-- task list, filled with showTasksOnPage() -->
        <ol id="taskList">
        </ol>

        <section id="button-section">
            <button type="button" id="add-task-btn" onclick="addTask()">Add Task</button>
            <button type="button" id="edit-task-btn" onclick="editTask()">Edit Task</button>
            <button type="button" id="dlt-task-btn" onclick="deleteTask()">Delete Task</button>
            <button type="button" id="show-tasks-btn" onclick="showAllTasks()">Show All Tasks</button>
        </section>
    </main>
</body>
</html>
